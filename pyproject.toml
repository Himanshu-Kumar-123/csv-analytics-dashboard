[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-analytics-dashboard"
version = "0.1.0"
description = "Upload CSV files, explore datasets, compute statistics, detect data-quality issues and build interactive Plotly charts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask~=3.1",
    "flask-sqlalchemy~=3.1",
    "flask-migrate~=4.0",
    "flask-wtf~=1.2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "plotly~=5.24",
    "marshmallow~=3.23",
    "reportlab~=4.2",
    "matplotlib~=3.9",
    "gunicorn~=23.0",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pypdf>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
]
e2e = [
    "playwright>=1.47",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "app/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not e2e'"
markers = [
    "slow: long-running performance tests (run with -m slow)",
    "e2e: browser end-to-end tests (run with -m e2e)",
]
filterwarnings = ["error::pandas.errors.PerformanceWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
