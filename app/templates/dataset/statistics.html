{% set page_title = "Statistics" %}
{% set show_filters = True %}
{% extends "dataset/_layout.html" %}
{% block page %}
<div id="stats-summary" class="row g-3 mb-3" aria-live="polite"></div>
<div id="stats-sections"></div>
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <h2 class="h6 mb-0">Correlations <span class="small text-body-secondary">(numeric columns, pairwise-complete)</span></h2>
      <div class="d-flex align-items-center gap-2">
        <label for="corr-method" class="small text-body-secondary">Method</label>
        <select id="corr-method" class="form-select form-select-sm w-auto">
          <option value="pearson" selected>Pearson</option>
          <option value="spearman">Spearman</option>
        </select>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-lg-8"><div id="corr-matrix" class="table-responsive"></div></div>
      <div class="col-lg-4">
        <h3 class="h6 small text-uppercase text-body-secondary">Strongest pairs</h3>
        <div id="corr-pairs"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/statistics.js') }}"></script>
{% endblock %}
