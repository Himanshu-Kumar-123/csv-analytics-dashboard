name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=app --cov-report=term --cov-fail-under=80

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: pytest -m e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t csv-analytics-dashboard:ci .
      - name: Smoke test
        run: |
          docker run -d --name dashboard -p 8000:8000 csv-analytics-dashboard:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && exit 0; sleep 2; done
          docker logs dashboard
          exit 1
